name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  book:
    name: mdBook build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # mdBook はcargo installだとビルドに数分かかるため、プリビルドバイナリを直接取得する。
      # peaceiris/actions-mdbook は2024年から更新が止まっており、Node.js 24に対応する
      # 見込みが薄いため使わない。0.4系・0.5系の両方で本文コードのテストが
      # 通ることを確認済み（ARCHITECTURE.md §3.4）。
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: mdbook build book
      - run: mdbook test book

  error-codes:
    name: compile_fail のエラーコード検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/check_error_codes.py

  exercises-build:
    name: 演習の骨組みがビルドできるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 骨組み（todo!()）はコンパイルは通り、実行時にpanicする。
      # ここではコンパイルが通ること（構文・シグネチャの誤りがないこと）と、
      # 学習者が最初に開くコードが rustfmt 済みであることを確認する。
      # （clippy は todo!() の未使用引数で失敗するため、骨組みには掛けない）
      - run: cargo build --workspace
      - run: cargo fmt --all --check
      # 入れ子 workspace（ルートから exclude されている）も個別に確認する
      - run: cd exercises/ex012_non_exhaustive && cargo build --workspace && cargo fmt --all --check
      - run: cd exercises/ex048_workspace && cargo build --workspace && cargo fmt --all --check
      - run: cd exercises/ex055_derive_macro && cargo build --workspace && cargo fmt --all --check
      # 骨組みのままなら、全ての演習が「⬜ N todo」と表示されること（❌ や ⚠️ が出たら骨組みかテストの問題）
      - name: check-exercises が骨組みを未着手と判定すること
        run: |
          cargo run -q -p check-exercises | tee status.txt
          if grep -E "❌|⚠️" status.txt; then exit 1; fi

  projects:
    name: 実践プロジェクト（projects/ workspace）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 骨組みがビルドでき、rustfmt 済みであること
      - run: cd projects && cargo build --workspace && cargo fmt --all --check
      # 解答を重ねて test / fmt / clippy
      - run: chmod +x tools/verify_projects.sh
      - run: ./tools/verify_projects.sh --fmt --clippy

  solutions:
    name: 解答の検証（test + fmt + clippy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: chmod +x tools/verify_solutions.sh
      - run: ./tools/verify_solutions.sh --fmt --clippy
