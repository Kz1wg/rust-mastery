name: Pages

# 教材（book/）を GitHub Pages に公開する。
# 事前にリポジトリの Settings → Pages → Build and deployment の Source を
# 「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # Actions タブから手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったときは、新しいほうを優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ci.yml と同じ mdBook を使う
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"
      - run: mdbook build book
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
